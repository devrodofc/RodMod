<!DOCTYPE html>
<html style="width:100%;height:100%;margin:0;padding:0;overflow:hidden;">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height, viewport-fit=cover"
    >

    <meta
        http-equiv="Content-Security-Policy"
        content="default-src * data: blob: filesystem:;
                 style-src * 'unsafe-inline';
                 script-src * 'unsafe-inline' 'unsafe-eval';
                 media-src * data: blob:;
                 img-src * data: blob: filesystem:;"
    >

    <title>RodMod</title>

    <script src="debug-ios.js"></script>
    <script src="cordova.js"></script>
    <script src="ios-compat.js"></script>
    <script src="pixi.min.js"></script>
</head>

<body style="width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000;">
    <div id="mlloader" style="color:white;text-align:center;">
        - Initializing -
    </div>

    <div id="all_container" style="width:100%;height:100%;margin:0;padding:0;">
        <canvas
            tabindex="0"
            id="jv"
            style="background:#000;width:100%;height:100%;margin:0;"
        ></canvas>
    </div>

    <script>
        document.write(
            '<script src="https://www.mysteralegacy.com/metaconfig.js?ver=' +
            Date.now() +
            '"><\/script>'
        );
    </script>

    <script>
        if (typeof mlmeta !== 'undefined') {
            document.write(
                '<script src="https://www.mysteralegacy.com/play/ml.min.js?ver=' +
                mlmeta.version +
                '"><\/script>'
            );
        } else {
            document.write(
                '<script src="https://www.mysteralegacy.com/play/ml.min.js"><\/script>'
            );
        }
    </script>

    <script>
        if (typeof jv.state === 'undefined') {
            document.write('<script src="ml.min.js"><\/script>');
        }
    </script>

    <script>
        (function carregarRodMod() {
            if (
                typeof window.jv !== 'undefined' &&
                typeof window.jv.state !== 'undefined'
            ) {
                const script = document.createElement('script');
                script.src = 'rodmod-mystera.js';
                script.id = 'rodmod-script';
                document.body.appendChild(script);

                console.log('[RodMod] carregado');
                return;
            }

            setTimeout(carregarRodMod, 250);
        })();
    </script>
</body>
</html>
