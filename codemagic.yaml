workflows:

  rodmod-ios:
    name: RodMod iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60

    working_directory: ios

    environment:
      node: 24
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci
          npm install -g cordova@13.0.0

      - name: Sync RodMod script
        script: |
          cp ../shared/rodmod-mystera.js www/rodmod-mystera.js

      - name: Add iOS platform
        script: |
          rm -rf platforms
          cordova platform add ios@8.1.0

      - name: Prepare iOS
        script: |
          cordova prepare ios

      - name: Build iOS simulator
        script: |
          cordova build ios --debug --emulator

    artifacts:
      - ios/platforms/ios/build/**/*.app
      - ios/platforms/ios/build/**/*.log


  rodmod-ios-device:
    name: RodMod iPhone Unsigned
    instance_type: mac_mini_m2
    max_build_duration: 60

    working_directory: ios

    environment:
      node: 24
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci
          npm install -g cordova@13.0.0

      - name: Sync RodMod script
        script: |
          cp ../shared/rodmod-mystera.js www/rodmod-mystera.js

      - name: Add iOS platform
        script: |
          rm -rf platforms
          cordova platform add ios@8.1.0

      - name: Prepare iOS
        script: |
          cordova prepare ios

      - name: Build unsigned iPhone app
        script: |
          mkdir -p "$CM_BUILD_DIR/ios/build/device"

          xcodebuild \
            -workspace platforms/ios/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/ios/build/device" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/ios/build/device" -maxdepth 1 -type d -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Nenhum .app encontrado"
            exit 1
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          zip -qry RodMod-unsigned.ipa Payload

          echo "IPA criada:"
          ls -lh RodMod-unsigned.ipa

    artifacts:
      - ios/RodMod-unsigned.ipa
      - ios/build/device/*.app
